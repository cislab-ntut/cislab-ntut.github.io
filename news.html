	<!-- 先套用主題與語系，避免畫面閃爍 -->
	<script>
		(function () {
			var root = document.documentElement, theme = null, lang = null;
			// 系統語言自動配對：依序看瀏覽器的偏好語言清單，中文 → TW、日文 → JP、英文 → EN，都沒有就用英文
			window.CIS_SYS_LANG = function () {
				var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
				for (var i = 0; i < list.length; i++) {
					var l = String(list[i]).toLowerCase();
					if (l.indexOf('zh') === 0) return 'zh';
					if (l.indexOf('ja') === 0) return 'ja';
					if (l.indexOf('en') === 0) return 'en';
				}
				return 'en';
			};
			try { theme = localStorage.getItem('theme'); lang = localStorage.getItem('lang'); } catch (e) {}   // lang 只在訪客手動切換時才會存
			var q = new URLSearchParams(location.search).get('lang');
			if (q === 'jp') q = 'ja';
			if (q === 'en' || q === 'zh' || q === 'ja') lang = q;
			if (lang !== 'en' && lang !== 'ja' && lang !== 'zh') lang = null;
			if (!theme) theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			if (!lang) lang = window.CIS_SYS_LANG();
			root.setAttribute('data-theme', theme);
			root.setAttribute('data-lang', lang);
			root.lang = { zh: 'zh-Hant-TW', en: 'en', ja: 'ja' }[lang];
					})();
	</script>
